##### --- CORE TERMINAL SETTINGS --- #####

set-option -g default-terminal "tmux-256color"
set-option -ga terminal-overrides ",xterm-256color:RGB"

set-option -g focus-events on
set-option -g mouse on

set-window-option -g mode-keys vi

# was 10 
set -s escape-time 0
set -g history-limit 5000
set -g base-index 1
set -g pane-base-index 1
set -g renumber-windows on


##### --- CLEAN PANE NAVIGATION (VIM STYLE) --- #####

# remove any existing bindings first (IMPORTANT)
unbind h
unbind j
unbind k
unbind l

bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R


##### --- SPLITS (your idea, kept) --- #####

bind y split-window -h
bind u split-window -v


##### --- USEFUL MINIMAL ADDITIONS --- #####

# quick toggle between last panes
#bind ; last-pane

# zoom pane
#bind z resize-pane -Z

# reload config
#bind r source-file ~/.tmux.conf \; display-message "tmux reloaded"
#
##### --- CRT GREEN AESTHETIC / STATUS BAR --- #####

# Status bar alignment and position
set -g status-position bottom
set -g status-justify left
set -g status-style "bg=#000000,fg=#00ff00"

# Border styling for active/inactive panes
set -g pane-border-style "fg=#003300"
set -g pane-active-border-style "fg=#00ff00"

# Left status bar (Session name)
set -g status-left-length 30
set -g status-left "#[fg=#000000,bg=#00ff00,bold] #S #[bg=#000000] "

# Window tab status format
set -g window-status-format "#[fg=#007700,bg=#000000] #I:#W "
set -g window-status-current-format "#[fg=#00ff00,bg=#002200,bold] #I:#W #[fg=#00ff00]*"

# Right status bar (disabled)
set -g status-right ""
# Right status bar (Time & Date)
#set -g status-right-length 50
#set -g status-right "#[fg=#00ff00,bg=#000000]| %Y-%m-%d %H:%M "

# Message/Command mode styling
set -g message-style "fg=#000000,bg=#00ff00,bold"
