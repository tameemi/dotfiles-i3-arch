
# args = ["-l", "-c", "tmux attach || tmux"]
# args = ["-l", "-c", "tmux"]
[terminal.shell]
program = "/usr/bin/zsh"
# args = ["-l", "-c"]

[env]
TERM = "alacritty"
WAYLAND_DISPLAY = "wayland-1"

[window]
decorations = "None"
dynamic_padding = true
title = ""
opacity = 0.97
option_as_alt = "Both"


[window.padding]
y = 0
x = 0


[font]
size = 12

[selection]
save_to_clipboard = true

# [font.offset]
# y = 1
# x = 0
# [font.glyph_offset]
# x = 0
# y = 1

[font.bold]
family = "Hack Nerd Font Mono"
style = "Bold"

[font.bold_italic]
family = "Hack Nerd Font Mono"
style = "Bold Italic"

[font.italic]
family = "Hack Nerd Font Mono"
style = "Italic"

[font.normal]
family = "Hack Nerd Font Mono"
style = "Regular"

# Dracula theme for Alacritty
# https://draculatheme.com/alacritty
#
# Color palette
# https://spec.draculatheme.com
#
# Instructions
# https://github.com/alacritty/alacritty/blob/master/extra/man/alacritty.5.scd
#


[cursor]
style = {shape = "block", blinking = "Always"}




[colors.primary]
background = "#0d1110"
foreground = "#c0dacb"
bright_foreground = "#33ff77"

[colors.cursor]

# text = "#282a36"
# cursor = "#f8f8f2"
# text = "#0d1110"
# cursor = "#33ff77"
text = "#000000"
cursor = "#00ff00"

[colors.vi_mode_cursor]

text = "CellBackground"
cursor = "CellForeground"

[colors.selection]

text = "CellForeground"
background = "#44475a"

[colors.normal]

black = "#21222c"
red = "#ff5555"
green = "#50fa7b"
yellow = "#f1fa8c"
blue = "#bd93f9"
magenta = "#ff79c6"
cyan = "#8be9fd"
white = "#f8f8f2"



[colors.bright]

black = "#6272a4"
red = "#ff6e6e"
green = "#69ff94"
yellow = "#ffffa5"
blue = "#d6acff"
magenta = "#ff92df"
cyan = "#a4ffff"
white = "#ffffff"

[colors.search.matches]

foreground = "#44475a"
background = "#50fa7b"

[colors.search.focused_match]

foreground = "#44475a"
background = "#ffb86c"

[colors.footer_bar]

background = "#282a36"
foreground = "#f8f8f2"

[colors.hints.start]

foreground = "#282a36"
background = "#f1fa8c"

[colors.hints.end]

foreground = "#f1fa8c"
background = "#282a36"

[general]
live_config_reload = true
working_directory = "/home/tameem/"

